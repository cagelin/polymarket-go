version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - revive
    - staticcheck
    - bodyclose
    - ineffassign
    - errorlint
    - contextcheck
    - copyloopvar
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - predeclared
    - unconvert
    - wastedassign
  settings:
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: disable
    presets: []
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
